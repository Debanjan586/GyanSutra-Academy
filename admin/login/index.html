<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — GyanSutra Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="/resources/gyansutra-favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="card">

    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none"
          stroke="#14181f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>GyanSutra Academy</h1>
      <p>Admin Portal — Course Management</p>
    </div>

    <div class="alert" id="alertBox" role="alert">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      <span id="alertMsg">Invalid email or password.</span>
    </div>

    <form id="loginForm" novalidate>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email"
          placeholder="you@example.com" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
          placeholder="••••••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">Log In</span>
        <span class="spinner"></span>
      </button>

    </form>

    <p class="back-link"><a href="/index.html">← Back to website</a></p>

  </div>
</div>
<script src="script.js"></script>
</body>
</html>
